
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px;
        }
        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }
        #nameDisplay {
            margin-top: 8px;
            font-size: 14px;
            color: #007bff;
        }
        #lastKey {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            color: #333;
        }
        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        #successMessage {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Registration Form</h2>
        <form id="registrationForm">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="Enter your name">
            <div id="nameDisplay"></div>
            <div id="nameError" class="error"></div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
            <div id="emailError" class="error"></div>
            <label for="course">Course:</label>
            <select id="course">
                <option value="">-- Select Course --</option>
                <option value="BCA">BCA</option>
                <option value="B.Sc">B.Sc</option>
                <option value="B.Com">B.Com</option>
                <option value="BBA">BBA</option>
            </select>
            <div id="courseError" class="error"></div>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">
            <div id="phoneError" class="error"></div>
            <div id="lastKey">
                Last key pressed: None
            </div>
            <button type="submit" id="registerButton">
                Register
            </button>
            <div id="successMessage"></div>
        </form>
    </div>
    <script>
        const form = document.getElementById("registrationForm");
        const studentName = document.getElementById("studentName");
        const nameDisplay = document.getElementById("nameDisplay");
        const registerButton = document.getElementById("registerButton");
        const lastKey = document.getElementById("lastKey");
        const successMessage = document.getElementById("successMessage");
        studentName.addEventListener("input", function () {
            if (studentName.value.trim() !== "") {
                nameDisplay.textContent =
                    "Student Name: " + studentName.value;
            } else {
                nameDisplay.textContent = "";
            }
        });
        registerButton.addEventListener("mouseover", function () {
            registerButton.style.backgroundColor = "green";
        });
        registerButton.addEventListener("mouseout", function () {
            registerButton.style.backgroundColor = "#007bff";
        });
        document.addEventListener("keydown", function (event) {
            lastKey.textContent =
                "Last key pressed: " + event.key;
        });
        form.addEventListener("submit", function (event) {
            event.preventDefault();
            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("courseError").textContent = "";
            document.getElementById("phoneError").textContent = "";
            successMessage.textContent = "";
            let isValid = true;
            if (studentName.value.trim() === "") {
                document.getElementById("nameError").textContent =
                    "Please enter your name.";
                isValid = false;
            }
            if (document.getElementById("email").value.trim() === "") {
                document.getElementById("emailError").textContent =
                    "Please enter your email.";
                isValid = false;
            }
            if (document.getElementById("course").value === "") {
                document.getElementById("courseError").textContent =
                    "Please select a course.";
                isValid = false;
            }
            if (document.getElementById("phone").value.trim() === "") {
                document.getElementById("phoneError").textContent =
                    "Please enter your phone number.";
                isValid = false;
            }
            if (isValid) {
                successMessage.textContent =
                    "Registration Successful!";
                form.reset();
                nameDisplay.textContent = "";
            }
        });
    </script>
</body>
</html>
