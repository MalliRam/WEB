<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>student form</title>
</head>

<body>

    <h1>Student Registration Form 1 </h1>
    <h1>Student Registration Form 1</h1>

    <form action="/register" method="post">

        <!-- Full Name -->
        <label for="fullname">Full Name:</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required
            minlength="3"
            maxlength="50"
        >
        <br><br>


        <!-- Email -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="ample@gexmail.com"
            required
        >
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            minlength="8"
            maxlength="20"
        >
        <br><br>


        <!-- Age -->
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
            required
            min="18"
            max="60"
        >
        <br><br>


        <!-- Mobile Number -->
        <label for="mobile">Mobile Number:</label>
        <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="9876543210"
            required
            minlength="10"
            maxlength="10"
            pattern="[0-9]{10}"
        >
        <br><br>


        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input
            type="date"
            id="dob"
            name="dob"
            required
            min="1960-01-01"
            max="2008-12-31"
        >
        <br><br>


        <!-- Gender -->
        <p>Gender:</p>

        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
            required
        >
        <label for="male">Male</label>

        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >
        <label for="female">Female</label>

        <input
            type="radio"
            id="other"
            name="gender"
            value="other"
        >
        <label for="other">Other</label>

        <br><br>


        <!-- Course -->
        <label for="course">Select Course:</label>

        <select
            id="course"
            name="course"
            required
        >
            <option value="">-- Select Course --</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
        </select>

        <br><br>


        <!-- Skills -->
        <p>Select your skills:</p>

        <input
            type="checkbox"
            id="html"
            name="skills"
            value="html"
        >
        <label for="html">HTML</label>

        <input
            type="checkbox"
            id="css"
            name="skills"
            value="css"
        >
        <label for="css">CSS</label>

        <input
            type="checkbox"
            id="python"
            name="skills"
            value="python"
        >
        <label for="python">Python</label>

        <br><br>


        <!-- Website -->
        <label for="website">Website:</label>
        <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
        >
        <br><br>


        <!-- Salary -->
        <!-- <label for="salary">Expected Salary:</label>
        <input
            type="number"
            id="salary"
            name="salary"
            placeholder="Enter salary"
            min="10000"
            max="1000000"
            step="5000"
        >
        <br><br> -->


        <!-- About -->
        <label for="about">About Yourself:</label>
        <br>

        <textarea
            id="about"
            name="about"
            rows="5"
            cols="40"
            placeholder="Write something about yourself"
            minlength="20"
            maxlength="500"
            required
        ></textarea>

        <br><br>


        <!-- Terms -->
        <input
            type="checkbox"
            id="terms"
            name="terms"
            value="accepted"
            required
        >

        <label for="terms">
            I agree to the terms and conditions
        </label>

        <br><br>


        <!-- Submit -->
        <button type="submit">Register</button>

        <!-- Reset -->
        <button type="reset">Reset</button>

    </form>

</body>
</html>
```
